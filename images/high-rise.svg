<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a8d0e6" />
      <stop offset="100%" stop-color="#374785" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g)" />
  <!-- simple skyline -->
  <g fill="#0b3c5d">
    <rect x="120" y="420" width="120" height="360" rx="4" />
    <rect x="260" y="300" width="160" height="480" rx="4" />
    <rect x="440" y="360" width="100" height="420" rx="4" />
    <rect x="560" y="240" width="220" height="540" rx="4" />
    <rect x="820" y="420" width="140" height="360" rx="4" />
    <rect x="980" y="330" width="180" height="450" rx="4" />
    <rect x="1200" y="280" width="200" height="500" rx="4" />
  </g>
  <text x="50%" y="88%" font-family="Open Sans, Arial" font-size="36" fill="#ffffff" text-anchor="middle">High-rise buildings</text>
</svg>
